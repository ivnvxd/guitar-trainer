  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1218">
  <script>
    // Set the theme before the first paint, so a light page does not flash dark.
    try {
      var theme = JSON.parse(localStorage.getItem('gt.settings') || '{}').theme || 'auto';
      if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      if (theme === 'light') document.querySelector('meta[name="theme-color"]').content = '#f4f6f9';
    } catch (e) { /* the dark theme stays */ }
  </script>
  <meta name="description" content="Guitar theory on the neck: notes, intervals, scales, chords, triads and keys, with ear training and fretboard drills.">

</head>
