<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1a1c1b">
  <script>
    // Set the theme before the first paint, so a light page does not flash dark.
    try {
      var theme = JSON.parse(localStorage.getItem('gt.settings') || '{}').theme || 'auto';
      if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      if (theme === 'light') document.querySelector('meta[name="theme-color"]').content = '#f2f3f0';
    } catch (e) { /* the dark theme stays */ }
  </script>
  <meta name="description" content="Guitar ear training and fretboard drills, with a library of scales, chords, triads, intervals and keys.">
  <title>Guitar Trainer</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/besley.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theory.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/fretboard.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/progress.js" defer></script>
  <script src="js/library.js" defer></script>
  <script src="js/train.js" defer></script>
  <script src="js/drills-ear.js" defer></script>
  <script src="js/drills-neck.js" defer></script>
  <script src="js/drills-keys.js" defer></script>
  <script src="js/tools.js" defer></script>
  <script src="js/pages.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/train"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9.3h18M3 14.7h18M9 4v16M15 4v16"/><circle cx="12" cy="12" r="2.2"/></svg><span id="brand-name">Guitar Trainer</span></a>
      <nav aria-label="Main">
        <a data-nav="train" href="#/train">Train</a>
        <a data-nav="library" href="#/library">Library</a>
        <a data-nav="progress" href="#/progress">Progress</a>
        <a data-nav="settings" href="#/settings">Settings</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <noscript><p class="noscript">This site needs JavaScript.</p></noscript>
</body>
</html>
